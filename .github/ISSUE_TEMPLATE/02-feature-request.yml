name: Feature request
description: Propose a specific change for the project to track.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please [search existing issues](https://github.com/GOODBOY008/r-shell/issues?q=is%3Aissue) first.
        If you want to explore an idea with the community, start in [Ideas](https://github.com/GOODBOY008/r-shell/discussions/categories/ideas).
  - type: textarea
    id: use-case
    attributes:
      label: What are you trying to do?
      description: Describe your workflow and where R-Shell makes it difficult today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to change?
      description: Describe how the feature would work from a user's perspective.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds or examples
      description: Share any workarounds, mockups, or examples that would help explain the request.
