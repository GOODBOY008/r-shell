# Dependabot version updates. Minor/patch bumps are grouped per ecosystem
# to keep the PR stream manageable. IronRDP moves as one release family;
# other major bumps stay as individual PRs.
version: 2
updates:
  # Frontend (root package.json; lockfile is pnpm-lock.yaml)
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
  # Rust backend
  - package-ecosystem: cargo
    directory: "/src-tauri"
    schedule:
      interval: monthly
    groups:
      # IronRDP shares types across subcrates. Its pre-1.0 minor bumps are
      # classified as major updates and must move with the rest of the family.
      ironrdp:
        patterns:
          - "ironrdp-*"
      cargo-minor-patch:
        exclude-patterns:
          - "ironrdp-*"
        update-types:
          - "minor"
          - "patch"
  # GitHub Actions (test.yml, release.yml)
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
