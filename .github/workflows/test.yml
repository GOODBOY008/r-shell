name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          brew install pkg-config

      - name: Install dependencies (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install frontend dependencies
        run: pnpm install

      - name: Run frontend tests
        run: pnpm test

      - name: Build frontend
        run: pnpm build

      - name: Check TypeScript types
        run: pnpm tsc --noEmit

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Windows imports validation
        if: always() && matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $exe = Get-ChildItem "src-tauri\target\debug\deps\r_shell_lib-*.exe" | Select-Object -First 1
          Write-Host "EXE: $($exe.FullName)"
          $dumpbin = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -find "**\dumpbin.exe" | Select-Object -First 1
          $raw = & $dumpbin /IMPORTS $exe.FullName | Out-String
          $raw -split "`r?`n" | ForEach-Object { Write-Host $_ }
          # Parse imports: lines like "    KERNEL32.dll" then indented symbol lines with hex ordinal
          $current = $null
          $imports = @{}
          foreach ($line in ($raw -split "`r?`n")) {
            if ($line -match '^\s+(\S+\.dll)\s*$') { $current = $Matches[1]; if (-not $imports[$current]) { $imports[$current] = @() } }
            elseif ($current -and $line -match '^\s+[0-9A-Fa-f]+\s+(\S+)') { $imports[$current] += $Matches[1] }
          }
          Write-Host "=== symbol validation ==="
          foreach ($dll in $imports.Keys) {
            $name = $dll; $sys = "C:\Windows\System32\$dll"
            if (-not (Test-Path $sys)) { Write-Host "DLL NOT FOUND: $dll"; continue }
            $exp = & $dumpbin /EXPORTS $sys | Out-String
            $exports = @($exp -split "`r?`n" | ForEach-Object { if ($_ -match '^\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+(\S+)') { $Matches[1] } })
            $expset = [System.Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
            foreach ($e in $exports) { [void]$expset.Add($e) }
            foreach ($sym in $imports[$dll]) {
              if (-not $expset.Contains($sym)) { Write-Host "MISSING ENTRYPOINT: $sym in $dll" }
            }
          }
          Write-Host "=== WER events ==="
          Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddHours(-1)} -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -match 'r_shell_lib' } | Select-Object -First 3 |
            ForEach-Object { Write-Host "---- $($_.TimeCreated)"; Write-Host $_.Message }
          Write-Host "=== SideBySide events ==="
          Get-WinEvent -FilterHashtable @{LogName='System'; StartTime=(Get-Date).AddHours(-1)} -ErrorAction SilentlyContinue |
            Where-Object { $_.ProviderName -match 'SideBySide' } | Select-Object -First 3 |
            ForEach-Object { Write-Host "---- $($_.TimeCreated)"; Write-Host $_.Message }
          exit 0

      - name: Run Rust clippy
        working-directory: src-tauri
        run: cargo clippy -- -D warnings
        continue-on-error: true

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check
        continue-on-error: true

  # Lightweight i18n key-parity check. Pure Node.js — no Rust/Tauri deps needed,
  # so it runs on a single platform and fails fast independently of the matrix.
  i18n:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check locale key parity (en.json ↔ zh-CN.json)
        run: pnpm i18n:check
