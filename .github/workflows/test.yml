name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          brew install pkg-config

      - name: Install dependencies (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install frontend dependencies
        run: pnpm install

      - name: Run frontend tests
        run: pnpm test

      - name: Build frontend
        run: pnpm build

      - name: Check TypeScript types
        run: pnpm tsc --noEmit

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Windows loader diagnostics
        if: failure() && matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $exe = Get-ChildItem "src-tauri\target\debug\deps\r_shell_lib-*.exe" | Select-Object -First 1
          Write-Host "EXE: $($exe.FullName) size=$($exe.Length)"
          Write-Host "--- DLLs in deps dir ---"
          Get-ChildItem "src-tauri\target\debug\deps\*.dll" | ForEach-Object { Write-Host "$($_.Name) $($_.Length)" }
          Write-Host "--- dumpbin /DEPENDENTS ---"
          $dumpbin = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -find "**\dumpbin.exe" | Select-Object -First 1
          if ($dumpbin) { & $dumpbin /DEPENDENTS $exe.FullName } else { Write-Host "dumpbin not found" }
          Write-Host "--- direct run attempt ---"
          $out = & $exe.FullName --list 2>&1 | Out-String
          Write-Host "exit=$LASTEXITCODE"
          Write-Host $out
          Write-Host "--- WER / Application events ---"
          try {
            Get-WinEvent -LogName Application -MaxEvents 60 -ErrorAction Stop |
              Where-Object { $_.Message -match "r_shell_lib|0xc0000139" } |
              Select-Object -First 5 | ForEach-Object { Write-Host "----"; Write-Host $_.TimeCreated; Write-Host $_.Message }
          } catch { Write-Host "no matching events" }

      - name: Run Rust clippy
        working-directory: src-tauri
        run: cargo clippy -- -D warnings
        continue-on-error: true

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check
        continue-on-error: true

  # Lightweight i18n key-parity check. Pure Node.js — no Rust/Tauri deps needed,
  # so it runs on a single platform and fails fast independently of the matrix.
  i18n:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check locale key parity (en.json ↔ zh-CN.json)
        run: pnpm i18n:check
