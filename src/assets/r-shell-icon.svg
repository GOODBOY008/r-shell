<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none" role="img" aria-labelledby="r-shell-v2-title r-shell-v2-desc">
  <title id="r-shell-v2-title">R-Shell</title>
  <defs>
    <linearGradient id="v2-bg-grad" x1="48" y1="48" x2="464" y2="464" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="48%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#0C4A6E"/>
    </linearGradient>

    <radialGradient id="v2-bg-light" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(130 110) scale(320)">
      <stop offset="0%" stop-color="#A7F3D0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0F766E" stop-opacity="0"/>
    </radialGradient>

    <filter id="v2-fg-shadow" x="60" y="110" width="392" height="280" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#042F2E" flood-opacity="0.38"/>
    </filter>

    <clipPath id="v2-outer-clip">
      <rect x="48" y="48" width="416" height="416" rx="96"/>
    </clipPath>
  </defs>

  <g clip-path="url(#v2-outer-clip)">
    <rect x="48" y="48" width="416" height="416" fill="url(#v2-bg-grad)"/>
    <rect x="48" y="48" width="416" height="416" fill="url(#v2-bg-light)"/>
    <rect x="49" y="49" width="414" height="414" rx="95" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2"/>
  </g>

  <g filter="url(#v2-fg-shadow)">
    <path d="M102 218L162 278L102 338" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M212 336V148H274C312 148 330 168 330 197C330 226 312 246 274 246H212M272 246L330 336" stroke="#FFFFFF" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="364" y="323" width="60" height="32" rx="16" fill="#FF7A3D"/>
  </g>
</svg>
