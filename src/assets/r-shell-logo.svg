    <path d="M48 48H344L128 368H48Z" fill="url(#rs-logo-jade)"/>
    <path d="M240 464L464 288V464Z" fill="#167967"/>
  </g>
  <rect x="104" y="104" width="304" height="304" rx="32" fill="#121820"/>
  <path d="M140 340V164H212C251 164 272 184 272 216C272 239 260 256 240 265L280 340H232L196 272H180V340ZM180 204V232H210C224 232 232 227 232 218C232 209 224 204 210 204Z" transform="translate(214 36) scale(.55)" fill="#D34516" fill-rule="evenodd"/>
  <path d="M152 256L208 308L152 360" stroke="#F4F7FA" stroke-width="32" stroke-linejoin="miter"/>
  <path d="M248 340H368V372H248Z" fill="#F4F7FA"/>
</svg>
