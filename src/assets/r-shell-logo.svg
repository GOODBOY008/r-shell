<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none" role="img" aria-labelledby="r-shell-logo-title r-shell-logo-description">
  <title id="r-shell-logo-title">R-Shell</title>
  <desc id="r-shell-logo-description">A prominent white terminal prompt with a small Rust-orange R at the upper-right of a dark tile, framed by jade, teal, and cyan diagonal fields.</desc>
  <defs>
    <linearGradient id="rs-logo-cyan" x1="464" y1="48" x2="120" y2="464" gradientUnits="userSpaceOnUse">
      <stop stop-color="#43C6DE"/>
      <stop offset="1" stop-color="#217F9E"/>
    </linearGradient>
    <linearGradient id="rs-logo-jade" x1="48" y1="48" x2="256" y2="384" gradientUnits="userSpaceOnUse">
      <stop stop-color="#91D8A0"/>
      <stop offset="1" stop-color="#22A885"/>
    </linearGradient>
    <clipPath id="rs-logo-bounds"><rect x="48" y="48" width="416" height="416" rx="96"/></clipPath>
  </defs>
  <g clip-path="url(#rs-logo-bounds)">
